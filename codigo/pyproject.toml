[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intermitencia"
version = "0.1.0"
description = "Dimensionamiento de plantas PV + BESS con métricas de intermitencia (B, M)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
rapido = ["numba>=0.59"]
dev = ["pytest>=7.4"]
notebook = [
    "jupyterlab>=4.2",
    "nbformat>=5.9",
    "nbconvert>=7.14",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
